name: security

# DevSecOps security gates. Each job is a build-failing gate:
#   test    — unit + security regression tests (pytest)
#   sast    — Semgrep static analysis (registry packs + custom rules)
#   secrets — Gitleaks secret scanning (full history)
#   deps    — Trivy dependency (SCA) scan of requirements.txt
#   image   — Trivy container image + Dockerfile config scan
#   dast    — OWASP ZAP baseline scan against the running API
#
# On `main` (the fixed app) all gates pass. On the `vulnerable` branch they go
# red — which is the whole point: the pipeline catches the planted OWASP issues.

on:
  push:
    branches: [ main, vulnerable ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab

jobs:
  # --------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r app/requirements.txt pytest
      - name: Run tests (incl. security regression tests)
        env:
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long-000
        run: pytest -q app/tests

  # --------------------------------------------------------------------- #
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.85.0
      - name: Run Semgrep (always writes SARIF)
        # vulnerable-app/ is kept committed only so reviewers can diff it against
        # app/. It is excluded here; the `vulnerable` branch overlays it into app/
        # (see scripts/create-vulnerable-branch.sh), which is what turns the gate red.
        # `|| true` so the SARIF is always produced even when findings exist; the
        # gate below decides pass/fail on error-severity findings only.
        run: |
          semgrep scan \
            --config p/python --config p/flask --config p/security-audit \
            --config .semgrep/custom-rules.yml \
            --exclude vulnerable-app \
            --sarif --output semgrep.sarif . || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Gate on error-severity findings
        # Fails the build only on ERROR-level findings (SQLi, command injection,
        # etc. — what the vulnerable branch trips). Warnings/audit notes don't
        # block, so the fixed app on main stays green.
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("semgrep.sarif"))
          errors = []
          for run in data.get("runs", []):
              levels = {r.get("id"): r.get("defaultConfiguration", {}).get("level")
                        for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for res in run.get("results", []):
                  if (res.get("level") or levels.get(res.get("ruleId"))) == "error":
                      errors.append(res.get("ruleId"))
          print(f"{len(errors)} error-severity finding(s)")
          for rid in errors[:25]:
              print("  ERROR:", rid)
          sys.exit(1 if errors else 0)
          PY

  # --------------------------------------------------------------------- #
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scan full history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------- #
  deps:
    name: Dependency scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy dependency scan (requirements.txt)
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed=false --ignorefile .trivyignore ./app

  # --------------------------------------------------------------------- #
  image:
    name: Container scan (Trivy image + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Build image
        run: docker build -t devsecops-api:ci ./app
      - name: Trivy Dockerfile misconfig scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 ./app
      - name: Trivy image vulnerability scan
        # Gate on FIXABLE CRITICALs only: base-image HIGH CVEs churn daily and are
        # outside our control, so gating on them would flap the pipeline red for
        # reasons unrelated to our code. The Dockerfile misconfig scan stays a hard gate.
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 devsecops-api:ci

  # --------------------------------------------------------------------- #
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the API
        run: |
          docker compose -f docker-compose.dast.yml up --build -d
          # wait for health
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/health; then echo ready; break; fi
            sleep 3
          done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:5000
          rules_file_name: .zap/rules.tsv
          fail_action: true          # fail only on FAIL-level rules (see -I below)
          allow_issue_writing: false # don't try to open a GitHub issue (needs issues:write)
          # -I: do NOT fail on warnings; only rules marked FAIL in rules.tsv fail the
          # build. On main the app sets a CSP header so rule 10038 passes (green);
          # the vulnerable branch omits it, so 10038 (FAIL) trips the gate (red).
          cmd_options: '-a -I'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dast.yml down
