name: security

# DevSecOps security gates. Each job is a build-failing gate:
#   test    — unit + security regression tests (pytest)
#   sast    — Semgrep static analysis (registry packs + custom rules)
#   secrets — Gitleaks secret scanning (full history)
#   deps    — Trivy dependency (SCA) scan of requirements.txt
#   image   — Trivy container image + Dockerfile config scan
#   dast    — OWASP ZAP baseline scan against the running API
#
# On `main` (the fixed app) all gates pass. On the `vulnerable` branch they go
# red — which is the whole point: the pipeline catches the planted OWASP issues.

on:
  push:
    branches: [ main, vulnerable ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # to upload SARIF to the Security tab

jobs:
  # --------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r app/requirements.txt pytest
      - name: Run tests (incl. security regression tests)
        env:
          JWT_SECRET: test-secret-not-for-prod
        run: pytest -q app/tests

  # --------------------------------------------------------------------- #
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.85.0
      - name: Run Semgrep (fails build on findings)
        # vulnerable-app/ is kept committed only so reviewers can diff it against
        # app/. It is excluded here; the `vulnerable` branch overlays it into app/
        # (see scripts/create-vulnerable-branch.sh), which is what turns the gate red.
        run: |
          semgrep scan \
            --config p/python --config p/flask --config p/security-audit \
            --config .semgrep/custom-rules.yml \
            --exclude vulnerable-app \
            --error --sarif --output semgrep.sarif .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --------------------------------------------------------------------- #
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scan full history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # --------------------------------------------------------------------- #
  deps:
    name: Dependency scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (requirements.txt)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ./app           # scan the deployed app's deps (see Semgrep note)
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'            # gate: fail on High/Critical
          ignore-unfixed: false
          trivyignores: .trivyignore

  # --------------------------------------------------------------------- #
  image:
    name: Container scan (Trivy image + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecops-api:ci ./app
      - name: Trivy Dockerfile misconfig scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: ./app
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: devsecops-api:ci
          # Gate on FIXABLE CRITICALs only: base-image HIGH CVEs churn daily and
          # are outside our control, so gating on them makes the pipeline flap
          # red for reasons unrelated to our code. The Dockerfile misconfig scan
          # above stays a hard HIGH/CRITICAL gate.
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # --------------------------------------------------------------------- #
  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the API
        run: |
          docker compose -f docker-compose.dast.yml up --build -d
          # wait for health
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/health; then echo ready; break; fi
            sleep 3
          done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:5000
          rules_file_name: .zap/rules.tsv
          fail_action: true         # gate: fail on FAIL-level alerts
          cmd_options: '-a'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dast.yml down
